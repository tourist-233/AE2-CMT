name: Release

# Pushing a tag like v1.1.3 builds the mod and attaches the jar to a GitHub Release, so the
# published artifact always comes from the tagged source rather than a local build.
on:
  push:
    tags:
      - 'v*'
  # Allows running it by hand from the Actions tab to check the build without tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --console=plain

      - name: Collect jar
        run: |
          mkdir -p release
          cp build/libs/*.jar release/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmt-jar
          path: release/*.jar
