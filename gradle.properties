# Local tinyproxy (127.0.0.1:8888) is the egress proxy for this container: the IPv4 route to
# maven.neoforged.net is firewalled (Connection reset). It must be running for dependency
# downloads; start it with `tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf` if it is not.
org.gradle.jvmargs=-Xmx1G
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=8888
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=8888
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.230
loader_version_range=[1,)

## Mod Properties
mod_id=cmt
mod_name=AE2 CMT
mod_license=MIT
mod_version=1.1.2
mod_group_id=com.wcmt

## Dependency Versions
ae2_version=19.2.17
# AE2WTlib (universal terminal library); API is embedded via jarJar
# see https://github.com/Mari023/AE2WirelessTerminalLibrary
# 19.x matches AE2 19.x (Minecraft 1.21.1)
ae2wtlib_version=19.5.1

# Longer timeouts & retries: asset/CDN downloads are slow in this container
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=5
